AWSTemplateFormatVersion: '2010-09-09'
Description: 'QuickSight Dataset Refresh Workflow - Deploys Lambda functions, Step Functions state machine, and associated resources'

Parameters:
  AccountId:
    Type: String
    Description: AWS Account ID where QuickSight dataset exists
  
  DatasetId:
    Type: String
    Description: QuickSight Dataset ID to refresh

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Environment name for resource identification

  NotificationEmail:
    Type: String
    Description: Email address for refresh notifications

Resources:
  # IAM Roles
  InitiatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quicksight-refresh-initiator-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QuickSightAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: quicksight:CreateIngestion
                Resource: !Sub arn:aws:quicksight:${AWS::Region}:${AccountId}:dataset/*
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'

  StatusCheckerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quicksight-refresh-status-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QuickSightAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - quicksight:ListIngestions
                  - quicksight:DescribeIngestion
                Resource: !Sub arn:aws:quicksight:${AWS::Region}:${AccountId}:dataset/*
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quicksight-refresh-sfn-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt InitiatorLambda.Arn
                  - !GetAtt StatusCheckerLambda.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

  # Lambda Functions
  InitiatorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub quicksight-refresh-initiator-${Environment}
      Handler: index.lambda_handler
      Role: !GetAtt InitiatorLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import uuid
          from typing import Dict, Any
          from botocore.exceptions import ClientError
          
          def lambda_handler(event: Dict[str, Any], context) -> Dict[str, Any]:
              """
              Initiates a QuickSight dataset ingestion
              """
              try:
                  # Extract parameters from the event
                  account_id = event['account_id']
                  dataset_id = event['dataset_id']
                  
                  # Initialize QuickSight client
                  quicksight = boto3.client('quicksight')
                  
                  # Generate unique ingestion ID
                  ingestion_id = str(uuid.uuid4())
                  
                  # Initiate dataset ingestion
                  response = quicksight.create_ingestion(
                      DataSetId=dataset_id,
                      IngestionId=ingestion_id,
                      AwsAccountId=account_id
                  )
                  
                  # Return success response
                  return {
                      'statusCode': 200,
                      'body': {
                          'message': 'Dataset ingestion initiated successfully',
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'ingestion_id': ingestion_id,
                          'ingestion_status': response['IngestionStatus'],
                          'aws_request_id': context.aws_request_id
                      }
                  }
                  
              except ClientError as e:
                  error_code = e.response['Error']['Code']
                  error_message = e.response['Error']['Message']
                  return {
                      'statusCode': 500,
                      'body': {
                          'error': f"AWS Error: {error_code}",
                          'message': error_message,
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'aws_request_id': context.aws_request_id
                      }
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': {
                          'error': 'Internal Error',
                          'message': str(e),
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'aws_request_id': context.aws_request_id
                      }
                  }
      Runtime: python3.9
      Timeout: 30
      MemorySize: 128
      Tags:
        - Key: Environment
          Value: !Ref Environment

  StatusCheckerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub quicksight-refresh-status-${Environment}
      Handler: index.lambda_handler
      Role: !GetAtt StatusCheckerLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          from typing import Dict, Any
          from botocore.exceptions import ClientError
          
          def lambda_handler(event: Dict[str, Any], context) -> Dict[str, Any]:
              """
              Checks most recent QuickSight dataset ingestion status
              """
              try:
                  # Extract parameters from the event
                  account_id = event['account_id']
                  dataset_id = event['dataset_id']
                  
                  # Initialize QuickSight client
                  quicksight = boto3.client('quicksight')
                  
                  # Get list of ingestions (most recent first)
                  list_response = quicksight.list_ingestions(
                      DataSetId=dataset_id,
                      AwsAccountId=account_id,
                      MaxResults=1
                  )
                  
                  if not list_response['Ingestions']:
                      return {
                          'statusCode': 404,
                          'body': {
                              'message': 'No ingestions found for dataset',
                              'account_id': account_id,
                              'dataset_id': dataset_id,
                              'aws_request_id': context.aws_request_id
                          }
                      }
                      
                  most_recent_ingestion = list_response['Ingestions'][0]
                  ingestion_id = most_recent_ingestion['IngestionId']
                  
                  # Get detailed status
                  response = quicksight.describe_ingestion(
                      DataSetId=dataset_id,
                      IngestionId=ingestion_id,
                      AwsAccountId=account_id
                  )
                  
                  ingestion_status = response['Ingestion']['IngestionStatus']
                  
                  return {
                      'statusCode': 200,
                      'body': {
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'ingestion_id': ingestion_id,
                          'ingestion_status': ingestion_status,
                          'status': 'IN_PROGRESS' if ingestion_status == 'RUNNING' else ingestion_status,
                          'error_info': response['Ingestion'].get('ErrorInfo', None),
                          'row_info': response['Ingestion'].get('RowInfo', None),
                          'queued_time': str(response['Ingestion'].get('QueuedTime')),
                          'ingestion_time_in_seconds': response['Ingestion'].get('IngestionTimeInSeconds'),
                          'aws_request_id': context.aws_request_id
                      }
                  }
                  
              except ClientError as e:
                  error_code = e.response['Error']['Code']
                  error_message = e.response['Error']['Message']
                  return {
                      'statusCode': 500,
                      'body': {
                          'error': f"AWS Error: {error_code}",
                          'message': error_message,
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'aws_request_id': context.aws_request_id
                      }
                  }
                  
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'body': {
                          'error': 'Internal Error',
                          'message': str(e),
                          'account_id': account_id,
                          'dataset_id': dataset_id,
                          'aws_request_id': context.aws_request_id
                      }
                  }
      Runtime: python3.9
      Timeout: 30
      MemorySize: 128
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Step Functions State Machine
  RefreshWorkflow:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub quicksight-refresh-workflow-${Environment}
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "QuickSight Dataset Ingestion Workflow",
          "StartAt": "InitiateIngestion",
          "States": {
            "InitiateIngestion": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${InitiatorLambda.Arn}",
                "Payload.$": "$"
              },
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 30,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "ResultPath": "$.initiateResult",
              "Next": "WaitForIngestion"
            },
            "WaitForIngestion": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckIngestionStatus"
            },
            "CheckIngestionStatus": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${StatusCheckerLambda.Arn}",
                "Payload.$": "$"
              },
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 30,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "ResultPath": "$.statusResult",
              "Next": "EvaluateStatus"
            },
            "EvaluateStatus": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.statusResult.Payload.body.status",
                  "StringEquals": "COMPLETED",
                  "Next": "IngestionSucceeded"
                },
                {
                  "Variable": "$.statusResult.Payload.body.status",
                  "StringEquals": "FAILED",
                  "Next": "IngestionFailed"
                }
              ],
              "Default": "WaitForIngestion"
            },
            "IngestionSucceeded": {
              "Type": "Succeed",
              "OutputPath": "$.statusResult.Payload.body"
            },
            "IngestionFailed": {
              "Type": "Fail",
              "Error": "IngestionFailed",
              "Cause": "QuickSight dataset ingestion failed. Check error details in the execution history."
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # SNS Topic and Subscription
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub quicksight-refresh-notifications-${Environment}

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref NotificationTopic
      Endpoint: !Ref NotificationEmail

  # CloudWatch Alarm
  RefreshFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub QuickSight-Refresh-Failure-${Environment}
      AlarmDescription: Alert on QuickSight refresh failure
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref RefreshWorkflow
      AlarmActions:
        - !Ref NotificationTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value: !Ref RefreshWorkflow
    Export:
      Name: !Sub ${AWS::StackName}-StateMachineArn

  NotificationTopicArn:
    Description: ARN of the SNS notification topic
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub ${AWS::StackName}-NotificationTopicArn

  InitiatorLambdaArn:
    Description: ARN of the Initiator Lambda function
    Value: !GetAtt InitiatorLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-InitiatorLambdaArn

  StatusCheckerLambdaArn:
    Description: ARN of the Status Checker Lambda function
    Value: !GetAtt StatusCheckerLambda.Arn
    Export:
